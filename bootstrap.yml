---
- hosts: all
  become: true
  pre_tasks:
   - name: install updates (Amazon Linux)
     tags: always
     dnf:
      update_cache: yes
     when: ansible_distribution_version == "2023"

   - name: install updates (Ubuntu)
     tags: always
     apt:
      upgrade: dist
      update_cache: yes
     when: ansible_distribution == "Ubuntu"

- hosts: all
  become: true
  tasks:
  - name: create izzah user
    tags: always
    user:
      name: izzah
      groups: root

  - name: add ssh key for izzah
    tags: always
    authorized_key:
      user: izzah
      key: "ssh-rsa "

  - name: add sudoers file for izzah
    tags: always
    copy:
      src: sudoer_izzah
      dest: /etc/sudoers.d/izzah
      owner: root
      group: root
      mode: 0440
